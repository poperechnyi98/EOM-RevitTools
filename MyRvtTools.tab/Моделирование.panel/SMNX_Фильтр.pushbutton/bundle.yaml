title: SMNX_Фильтр
tooltip: >-
  Заполняет параметр SMNX_Фильтр у всех элементов модели, у которых он есть (значение
  вводится, по умолчанию «ЭОМ»). Режим: заполнить только пустые или перезаписать у всех.
  Перед записью показывает, сколько элементов изменится. Нужен для фильтров видов и вкладки
  «Цвета» View Manager. Одно действие — отменяется Ctrl+Z.
author: MyRvtTools
