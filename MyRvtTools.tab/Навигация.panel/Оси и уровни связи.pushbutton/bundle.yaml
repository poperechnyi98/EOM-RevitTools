title: Оси и уровни связи
tooltip: |
  Сравнивает уровни и оси модели с уровнями и осями связи КФП и показывает список в окне pyRevit: что совпадает, что расходится (отметка уровня, смещение или поворот оси), что названо по-другому и чего нет в модели или в связи. Связь берётся по слову в имени («КФП»), иначе — выбор из списка. Координаты связи — с учётом её размещения. Модель не меняет.

  Shift+клик — настройки (слово в имени связи, допуск в мм).
author: "MyRvtTools (на основе LowLife, А. Персиянов)"
