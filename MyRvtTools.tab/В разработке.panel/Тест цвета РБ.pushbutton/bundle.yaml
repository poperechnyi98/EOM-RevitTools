title: Тест цвета РБ
tooltip: >-
  ТЕХНИЧЕСКИЙ ТЕСТ для будущей вкладки «Цвета» View Manager. Создаёт на активном виде
  фильтр «Рабочий набор содержит <текст>» с красной заливкой, чтобы проверить, красит ли
  Revit элементы внутри связей по имени их рабочего набора. Показывает, в каких связях
  есть такой рабочий набор. Одно действие — отменяется Ctrl+Z.
author: MyRvtTools
