title: Экспликация фрагмента
tooltip: |
  Экспликация помещений по обрезанному плану (фрагменту). Берёт помещения модели и видимых связей, чья точка размещения попадает в рамку подрезки активного плана, и создаёт спецификацию-таблицу: номер, наименование, площадь, категория — без фильтров. Вид таблицы (настройка): ручная спецификация без параметров в модели или ключевая спецификация. Если у плана экспликация уже есть — она обновляется (то же делает кнопка «Обновить экспликацию»).

  Shift+клик — настройки: вид таблицы, название, заголовки и ширины граф, высота строк (по умолчанию — форма 2 ГОСТ 21.501: 15/80/20/10 мм, шапка 20, строка 8), параметры номера/имени/площади/категории помещения, знаки площади.
author: "MyRvtTools (на основе LowLife, А. Персиянов)"
