title: Обновить экспликацию
tooltip: |
  Пересобирает экспликации фрагментов (созданные кнопкой «Экспликация фрагмента») по текущим помещениям и настройкам.

  Клик — все экспликации фрагментов в проекте.
  Shift+клик — только выбранные: выделенные спецификации (на листе или в диспетчере проекта), открытая экспликация, экспликации открытого плана или листа; если ничего не выбрано — список, из которого выбрать.
author: "MyRvtTools (на основе LowLife, А. Персиянов)"
