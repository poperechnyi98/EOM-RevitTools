title: Марки оборудования
tooltip: |
  Ставит и раскладывает марки оборудования на активном виде ровно и без пересечений. Три режима (кнопка спрашивает; если выделены только марки — сразу первый):
  «Разложить выбранные марки» — двигаются только выбранные марки (у выбранного оборудования — все его марки на виде), новые не создаются.
  «Поставить марки на оборудование» — для выбранного оборудования без марки открывается таблица по семействам: что маркировать и каким типом марки (выбор запоминается). Новые и существующие одиночные марки оборудования на текущем виде раскладываются совместно; закреплённые остаются на месте.
  «Маркировать оборудование смежной модели» — выберите несколько экземпляров связей: маркируется их оборудование, видимое на текущем виде (Revit 2024+). Типы марок выбираются по семействам; существующие марки участвуют в общей раскладке без создания дублей. Выноски связей привязаны к семействам.
  Выноска идёт к УГО (в том числе к вложенной аннотации), а не к 3D-семейству, и следует за прибором при его сдвиге/повороте; полка выноски — ровно на уровне марки.

  Shift+клик — настройки: отступ, зазор между марками, длина полки, что считать «рядом» (мм на листе).
author: "MyRvtTools (на основе LowLife, А. Персиянов)"
