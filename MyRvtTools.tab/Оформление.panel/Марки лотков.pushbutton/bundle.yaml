title: Марки лотков
tooltip: |
  Ставит и раскладывает марки кабельных лотков на активном виде ровно и без пересечений — так же, как «Марки оборудования». Два режима (кнопка спрашивает; если выделены только марки — сразу первый):
  «Разложить выбранные марки» — двигаются только выбранные марки лотков (у выбранного лотка — все его марки на виде), новые не создаются.
  «Поставить марки на лотки» — на выбранные лотки без марки на виде ставится марка (тип выбирается списком, если их несколько; выбор запоминается) и сразу раскладывается. Соединительные детали не маркируются (и не выбираются), лотки под наклоном и вертикальные — пропускаются.
  Марка смотрит в середину видимой части лотка, выноска — от края лотка, полка — ровно на уровне марки.

  Shift+клик — настройки: отступ, зазор между марками, длина полки, что считать «рядом» (мм на листе), допуск наклона (градусы).
author: "MyRvtTools (на основе LowLife, А. Персиянов)"
