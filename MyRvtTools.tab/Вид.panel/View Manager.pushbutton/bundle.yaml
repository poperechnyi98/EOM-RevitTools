title: View Manager
tooltip: >-
  Показывает или скрывает закреплённую панель View Manager (встаёт вкладкой рядом с «Диспетчером проекта»).
  Рабочие наборы активного вида: группы и все наборы — цветные плитки (зелёная — включено, серая — выключено, жёлтая — группа включена частично), нажатие переключает. Вкладка «Категории» — быстрые категории элементов и аннотаций.
  Если шаблон вида управляет рабочими наборами, изменения вносятся в шаблон — только при включённой
  галочке «Разрешаю менять шаблон вида». Каждое действие отменяется Ctrl+Z.
author: MyRvtTools
